# APXESS static site — served inside the Docker container on port 80.
# Your host reverse proxy (the one already routing erp/finance/app) should
# proxy the APXESS subdomain to this container. See DEPLOY.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Multi-page static site: serve the file, else 404 (not a SPA).
    location / {
        try_files $uri $uri/ =404;
    }

    # Long cache for static assets (css/js/images/fonts).
    location ~* \.(?:css|js|jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
