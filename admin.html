<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APXESS 可视化编辑后台</title>
  <style>
    :root{
      --navy:#0f2545; --red:#c8102e; --amber:#ff9900; --line:#e4e7ec;
      --bg:#f4f6f9; --panel:#fff; --muted:#6b7280; --ok:#1a9d4f;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:#1a1f2b;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
    /* Top bar */
    .topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--navy);color:#fff;flex:none;flex-wrap:wrap;}
    .topbar .logo{font-weight:700;letter-spacing:2px;font-size:18px;}
    .topbar .logo b{color:var(--amber);}
    .topbar .spacer{flex:1;}
    .topbar .hint{font-size:12px;color:#b9c4d6;}
    .tbtn{border:0;border-radius:7px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;}
    .tbtn.primary{background:var(--amber);color:#111;}
    .tbtn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);}
    .tbtn.warn{background:#e5484d;color:#fff;}
    .tbtn:hover{opacity:.9;}
    /* Body split */
    .main{flex:1;display:flex;min-height:0;}
    .editor{width:460px;flex:none;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 14px 80px;}
    .preview-wrap{flex:1;display:flex;flex-direction:column;min-width:0;background:#dfe3e8;}
    .preview-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#eef1f5;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;}
    .preview-bar select{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
    .preview-bar .pv-note{font-size:12px;color:var(--muted);}
    iframe{flex:1;width:100%;border:0;background:#fff;}
    /* Accordion sections */
    .sec{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;}
    .sec>summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:14.5px;background:#fafbfc;list-style:none;
      display:flex;align-items:center;gap:8px;}
    .sec>summary::-webkit-details-marker{display:none;}
    .sec>summary::before{content:"▸";color:var(--red);transition:transform .15s;}
    .sec[open]>summary::before{transform:rotate(90deg);}
    .sec .sec-body{padding:12px 14px;border-top:1px solid var(--line);}
    .sec .sec-desc{font-size:12px;color:var(--muted);margin:-2px 0 12px;}
    /* Fields */
    .fld{display:block;margin-bottom:12px;}
    .fld-label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:5px;}
    .fld input[type=text],.fld textarea,.fld input:not([type]){width:100%;padding:8px 10px;border:1px solid var(--line);
      border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;}
    .fld textarea{min-height:78px;resize:vertical;line-height:1.5;}
    .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--navy);}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    /* Image field */
    .img-row{display:flex;gap:8px;align-items:center;}
    .img-thumb{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#f0f0f0;flex:none;}
    .img-row input{flex:1;}
    .mini-btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;padding:7px 11px;font-size:12.5px;cursor:pointer;font-weight:600;white-space:nowrap;}
    .mini-btn:hover{background:var(--navy);color:#fff;}
    /* List item cards */
    .item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:#fcfcfd;}
    .item-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
    .item-head .t{font-weight:700;font-size:13px;flex:1;color:var(--navy);}
    .icon-btn{border:1px solid var(--line);background:#fff;border-radius:5px;width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1;color:#555;}
    .icon-btn:hover{background:#f0f0f0;}
    .icon-btn.del:hover{background:#e5484d;color:#fff;border-color:#e5484d;}
    .add-btn{width:100%;border:1px dashed var(--navy);background:#f5f8ff;color:var(--navy);border-radius:7px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;}
    .add-btn:hover{background:var(--navy);color:#fff;}
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;}
    .toast.show{opacity:1;}
    .save-dot{color:var(--ok);font-size:12px;}
    @media(max-width:820px){
      .main{flex-direction:column;}
      .editor{width:100%;height:50%;}
      .preview-wrap{height:50%;}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">▲ <b>APXESS</b> 编辑后台</div>
    <span class="hint" id="saveState">改动会自动暂存</span>
    <div class="spacer"></div>
    <button class="tbtn ghost" id="btnOpen">🔗 新窗口预览</button>
    <button class="tbtn warn" id="btnReset">↺ 放弃改动</button>
    <button class="tbtn primary" id="btnExport">⬇ 导出 data.js</button>
  </div>

  <div class="main">
    <div class="editor" id="editor"><!-- forms injected here --></div>
    <div class="preview-wrap">
      <div class="preview-bar">
        <span class="pv-note">实时预览：</span>
        <select id="pageSelect">
          <option value="index.html">首页 Home</option>
          <option value="shop.html">商店 Shop</option>
          <option value="about.html">品牌故事 About</option>
          <option value="contact.html">联系 Contact</option>
        </select>
        <button class="mini-btn" id="btnRefresh">刷新</button>
        <span class="pv-note">改完记得点右上角「导出 data.js」再上传到 Cloudflare</span>
      </div>
      <iframe id="preview" title="preview"></iframe>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
